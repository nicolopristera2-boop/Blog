<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOGBOOK</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #131926;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(249, 115, 22, 0.4);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f97316;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.5;
      padding-bottom: 5rem;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }

    /* BARRA SEGRETA ADMIN (Invisibile di default) */
    .admin-bar {
      display: none;
      background: #1e1b4b;
      border-bottom: 1px solid rgba(129, 140, 248, 0.3);
      padding: 0.5rem 1.5rem;
      font-size: 0.8rem;
      color: #c7d2fe;
      justify-content: space-between;
      align-items: center;
    }
    .admin-bar.active { display: flex; }
    .admin-bar-actions { display: flex; gap: 0.75rem; align-items: center; }
    
    .btn-admin-action {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.75rem;
    }
    .btn-admin-logout {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #cbd5e1;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    /* TOP BAR NORMALE */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 1px;
      color: var(--text);
      text-decoration: none;
    }
    .brand span { color: var(--accent); }

    .menu-container { position: relative; }
    .menu-trigger {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .menu-trigger:hover { border-color: var(--accent); }
    .avatar {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 0.75rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    .dropdown {
      position: absolute; top: calc(100% + 8px); right: 0; width: 210px;
      background: #161e2e; border: 1px solid var(--border);
      border-radius: 12px; padding: 0.4rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: none; z-index: 50;
    }
    .dropdown.show { display: block; }
    .dropdown a {
      display: block; padding: 0.6rem 0.8rem; color: var(--text);
      text-decoration: none; font-size: 0.85rem; border-radius: 8px;
    }
    .dropdown a:hover { background: rgba(255, 255, 255, 0.08); color: var(--accent); }
    .dropdown a small { display: block; color: var(--muted); font-size: 0.72rem; }

    /* HERO & FILTERS */
    .hero { text-align: center; padding: 3rem 0 2rem; }
    .main-title {
      font-family: 'Syne', sans-serif; font-size: 2.5rem;
      font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
    }
    .subtitle { font-size: 0.8rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
    
    .filters {
      display: flex; justify-content: center; gap: 0.5rem;
      flex-wrap: wrap; margin-top: 2rem;
    }
    .filter-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 0.4rem 1rem; border-radius: 999px;
      font-size: 0.85rem; cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .filter-btn.active {
      background: var(--text); color: var(--bg);
      border-color: var(--text); font-weight: 600;
    }

    /* GRID & CARD */
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem; margin-top: 2.5rem;
    }
    .card {
      position: relative;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--border-hover); }
    .card-media { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .card-media iframe, .card-media img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border: none;
    }
    .badge {
      position: absolute; bottom: 10px; right: 10px;
      background: rgba(0, 0, 0, 0.8); padding: 0.2rem 0.5rem;
      border-radius: 6px; font-size: 0.72rem; font-weight: 600;
    }

    /* PULSANTE ELIMINA (SOLO ADMIN) */
    .btn-delete-post {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(239, 68, 68, 0.9);
      border: none;
      color: #fff;
      padding: 0.35rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .btn-delete-post:hover { background: #dc2626; }
    body.is-admin .btn-delete-post { display: block; }

    .card-body { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; }
    .card-meta { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 0.4rem; }
    .card-category { color: var(--accent); font-weight: 600; text-transform: uppercase; }
    .card-date { color: var(--muted); }
    .card-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.5rem; }
    .card-desc { font-size: 0.88rem; color: var(--muted); line-height: 1.5; white-space: pre-line; }

    /* MODAL SCRITTURA ARTICOLO */
    .modal-backdrop {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-backdrop.show { display: flex; }
    .modal-window {
      background: #131926; border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem; width: 100%; max-width: 580px;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .modal-title { font-family: 'Syne', sans-serif; font-size: 1.4rem; }
    .input-field, .select-field, .textarea-field {
      width: 100%; background: #0b0f17; border: 1px solid var(--border);
      border-radius: 8px; padding: 0.7rem; color: var(--text); font-family: inherit; font-size: 0.9rem;
    }
    .textarea-field { min-height: 120px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 0.5rem; }
    .btn-submit {
      background: var(--accent); border: none; padding: 0.6rem 1.2rem;
      border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer;
    }
    .btn-cancel {
      background: transparent; border: 1px solid var(--border);
      padding: 0.6rem 1.2rem; border-radius: 8px; color: var(--muted); cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- BARRA DI STATO ADMIN (Visibile solo quando sbloccata) -->
  <div class="admin-bar" id="adminBar">
    <span>🔒 <strong>Modalità Autore Attiva</strong></span>
    <div class="admin-bar-actions">
      <button class="btn-admin-action" id="openEditorBtn">+ Nuovo Articolo</button>
      <button class="btn-admin-logout" id="logoutBtn">Esci</button>
    </div>
  </div>

  <div class="container">
    <header class="top-bar">
      <a href="#" class="brand">NICOLÒ<span>.</span></a>

      <div class="menu-container">
        <button class="menu-trigger" id="menuBtn">
          <div class="avatar">N</div>
          <span>Link</span> ▾
        </button>
        <div class="dropdown" id="menuDropdown">
          <a href="https://portfolio-url.github.io" target="_blank">
            Portfolio Progetti ↗
            <small>Hardware, CAD & Regia</small>
          </a>
          <a href="https://cv-url.github.io" target="_blank">
            Curriculum Vitae ↗
            <small>Esperienze e Formazione</small>
          </a>
        </div>
      </div>
    </header>

    <section class="hero">
      <h1 class="main-title">LOGBOOK</h1>
      <p class="subtitle">Tech, Filmmaking & Pensieri</p>

      <div class="filters">
        <button class="filter-btn active" data-cat="all">Tutti</button>
        <button class="filter-btn" data-cat="tech">Tech & Hardware</button>
        <button class="filter-btn" data-cat="cinema">Cinema & Video</button>
        <button class="filter-btn" data-cat="making-of">Making Of</button>
        <button class="filter-btn" data-cat="riflessioni">Riflessioni</button>
      </div>
    </section>

    <main class="grid" id="postsContainer"></main>
  </div>

  <!-- MODAL EDITOR NUOVO ARTICOLO -->
  <div class="modal-backdrop" id="editorModal">
    <div class="modal-window">
      <h2 class="modal-title">Nuovo Articolo</h2>
      
      <input type="text" id="postTitle" class="input-field" placeholder="Titolo articolo..." required>
      
      <select id="postCategory" class="select-field">
        <option value="tech">Tech & Hardware</option>
        <option value="cinema">Cinema & Video</option>
        <option value="making-of">Making Of</option>
        <option value="riflessioni">Riflessioni</option>
      </select>

      <select id="postMediaType" class="select-field">
        <option value="video">Video (YouTube / Vimeo Link)</option>
        <option value="image">Immagine (URL Foto)</option>
      </select>

      <input type="url" id="postMediaUrl" class="input-field" placeholder="Incolla link (es. https://youtu.be/... o link foto)" required>

      <textarea id="postContent" class="textarea-field" placeholder="Scrivi qui il dietro le quinte, considerazioni tecniche..."></textarea>

      <div class="modal-actions">
        <button class="btn-cancel" id="closeEditorBtn">Chiudi</button>
        <button class="btn-submit" id="savePostBtn">Pubblica</button>
      </div>
    </div>
  </div>

  <script>
    const REPO_OWNER = "nicolopristera2-boop";
    const REPO_NAME = "Blog";
    const FILE_PATH = "posts.json";

    let allPosts = [];

    // Controlla lo stato di login all'avvio
    function checkAdminStatus() {
      const token = localStorage.getItem('gh_blog_token');
      if (token) {
        document.body.classList.add('is-admin');
        document.getElementById('adminBar').classList.add('active');
      } else {
        document.body.classList.remove('is-admin');
        document.getElementById('adminBar').classList.remove('active');
      }
    }

    // SCORCIATOIA DA TASTIERA SEGRETA: CTRL + SHIFT + A (o CMD + SHIFT + A)
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
        e.preventDefault();
        const currentToken = localStorage.getItem('gh_blog_token');
        if (currentToken) {
          alert("Sei già loggato come autore.");
        } else {
          const pass = prompt("Area Autore. Inserisci il tuo GitHub Personal Access Token:");
          if (pass && pass.trim().startsWith('ghp_')) {
            localStorage.setItem('gh_blog_token', pass.trim());
            checkAdminStatus();
            alert("Accesso eseguito con successo!");
          } else if (pass) {
            alert("Token non valido.");
          }
        }
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('gh_blog_token');
      checkAdminStatus();
      alert("Sei uscito dalla modalità autore.");
    });

    // Embed Formatter
    function formatMediaEmbed(url, type) {
      if (type === 'video') {
        let embedUrl = url;
        if (url.includes('youtube.com/watch?v=')) {
          embedUrl = url.replace('watch?v=', 'embed/');
        } else if (url.includes('youtu.be/')) {
          const id = url.split('youtu.be/')[1].split('?')[0];
          embedUrl = `https://www.youtube-nocookie.com/embed/${id}`;
        }
        return `<iframe src="${embedUrl}" allowfullscreen loading="lazy"></iframe><div class="badge">▶ Video</div>`;
      } else {
        return `<img src="${url}" alt="Cover" loading="lazy"><div class="badge">Foto</div>`;
      }
    }

    // Carica Posts
    async function loadPosts() {
      const container = document.getElementById('postsContainer');
      try {
        const res = await fetch(`${FILE_PATH}?t=${Date.now()}`);
        if (!res.ok) throw new Error("File posts.json non trovato.");
        allPosts = await res.json();
        renderPosts('all');
      } catch (err) {
        container.innerHTML = `<p style="color:var(--muted); text-align:center;">Nessun post caricato o file posts.json vuoto.</p>`;
      }
    }

    function renderPosts(category) {
      const container = document.getElementById('postsContainer');
      container.innerHTML = '';

      const filtered = category === 'all' 
        ? allPosts 
        : allPosts.filter(p => p.category === category);

      filtered.forEach(p => {
        const card = document.createElement('article');
        card.className = 'card';
        card.setAttribute('data-category', p.category);
        card.innerHTML = `
          <button class="btn-delete-post" onclick="deletePost(${p.id})">🗑️ Elimina</button>
          <div class="card-media">
            ${formatMediaEmbed(p.mediaUrl, p.type)}
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span class="card-category">${p.category}</span>
              <time class="card-date">${p.date}</time>
            </div>
            <h2 class="card-title">${p.title}</h2>
            <p class="card-desc">${p.content}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Modal Editor
    const modal = document.getElementById('editorModal');
    document.getElementById('openEditorBtn').addEventListener('click', () => modal.classList.add('show'));
    document.getElementById('closeEditorBtn').addEventListener('click', () => modal.classList.remove('show'));

    // AGGIUNTA ARTICOLO
    document.getElementById('savePostBtn').addEventListener('click', async () => {
      const token = localStorage.getItem('gh_blog_token');
      if (!token) return alert("Non autorizzato.");

      const title = document.getElementById('postTitle').value.trim();
      const category = document.getElementById('postCategory').value;
      const type = document.getElementById('postMediaType').value;
      const mediaUrl = document.getElementById('postMediaUrl').value.trim();
      const content = document.getElementById('postContent').value.trim();

      if (!title || !mediaUrl) return alert("Inserisci titolo e link.");

      const btn = document.getElementById('savePostBtn');
      btn.innerText = "Salvataggio...";
      btn.disabled = true;

      try {
        const fileRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          headers: { Authorization: `token ${token}` }
        });
        const fileData = await fileRes.json();
        const posts = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

        const now = new Date();
        const dateStr = now.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });

        posts.unshift({
          id: Date.now(),
          title,
          category,
          type,
          mediaUrl,
          date: dateStr.charAt(0).toUpperCase() + dateStr.slice(1),
          content
        });

        const updateRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: `Aggiunto articolo: ${title}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2)))),
            sha: fileData.sha
          })
        });

        if (!updateRes.ok) throw new Error("Errore durante il salvataggio.");

        alert("Articolo aggiunto!");
        modal.classList.remove('show');
        document.getElementById('postTitle').value = '';
        document.getElementById('postMediaUrl').value = '';
        document.getElementById('postContent').value = '';
        loadPosts();
      } catch (err) {
        alert("Errore: " + err.message);
      } finally {
        btn.innerText = "Pubblica";
        btn.disabled = false;
      }
    });

    // CANCELLAZIONE ARTICOLO
    // CANCELLAZIONE ARTICOLO CORRETTA
async function deletePost(id) {
  const token = localStorage.getItem('gh_blog_token');
  if (!token) return alert("Non autorizzato. Premi CTRL+SHIFT+A per autenticarti.");

  if (!confirm("Vuoi davvero eliminare definitivamente questo articolo?")) return;

  try {
    // 1. Recupera l'ultima versione del file direttamente da GitHub API (bypassa la cache del browser)
    const fileRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}?ref=main`, {
      headers: { 
        Authorization: `token ${token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });

    if (!fileRes.ok) throw new Error("Impossibile recuperare il file posts.json da GitHub.");

    const fileData = await fileRes.json();
    let posts = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

    // 2. Filtro flessibile (converte entrambi a stringa per evitare mismatch numero/stringa)
    const originalLength = posts.length;
    posts = posts.filter(item => String(item.id) !== String(id));

    if (posts.length === originalLength) {
      alert("Post non trovato nell'elenco su GitHub.");
      return;
    }

    // 3. Esegue il commit della nuova lista senza il post
    const updateRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
      method: 'PUT',
      headers: { 
        Authorization: `token ${token}`, 
        'Content-Type': 'application/json' 
      },
      body: JSON.stringify({
        message: `Rimosso post ID: ${id}`,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2)))),
        sha: fileData.sha
      })
    });

    if (!updateRes.ok) throw new Error("Errore durante l'aggiornamento su GitHub.");

    // 4. Aggiorna immediatamente l'interfaccia locale senza aspettare la CDN di GitHub
    allPosts = posts;
    renderPosts('all');
    alert("Articolo rimosso con successo!");

  } catch (err) {
    alert("Errore eliminazione: " + err.message);
  }
}
    
      try {
        const fileRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          headers: { Authorization: `token ${token}` }
        });
        const fileData = await fileRes.json();
        let posts = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

        // Filtra via l'articolo con questo ID
        posts = posts.filter(item => item.id !== id);

        const updateRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: `Eliminato post ID: ${id}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2)))),
            sha: fileData.sha
          })
        });

        if (!updateRes.ok) throw new Error("Errore durante la cancellazione.");

        alert("Articolo rimosso con successo!");
        loadPosts();
      } catch (err) {
        alert("Errore eliminazione: " + err.message);
      }
    }

    // Filtri Categorie
    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderPosts(btn.getAttribute('data-cat'));
      });
    });

    // Menu Link
    const menuBtn = document.getElementById('menuBtn');
    const menuDropdown = document.getElementById('menuDropdown');
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      menuDropdown.classList.toggle('show');
    });
    document.addEventListener('click', () => menuDropdown.classList.remove('show'));

    // Init
    checkAdminStatus();
    loadPosts();
  </script>
</body>
</html>
